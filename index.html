<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ứng dụng của tôi</title>
  <meta name="description" content="Trang tổng hợp các ứng dụng web cá nhân.">
  <link rel="icon" href="port-academy/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f4f6f9; --card:#fff; --text:#16202e; --muted:#5b6878; --border:#dbe2ea; --primary:#0b5c8a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0e141b; --card:#16202b; --text:#e6edf3; --muted:#9aa8b7; --border:#2a3847; --primary:#4ba3d9; } }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:32px 16px; }
    h1 { margin:0 0 6px; }
    p { color:var(--muted); margin-top:0; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin-top:20px; }
    a.card { display:flex; gap:14px; align-items:center; padding:18px; border-radius:14px; background:var(--card); border:1px solid var(--border); color:var(--text); text-decoration:none; }
    a.card:hover { border-color:var(--primary); }
    a.card img { width:52px; height:52px; border-radius:12px; flex:none; }
    a.card b { display:block; }
    a.card span { color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Ứng dụng của tôi</h1>
    <p>Chọn ứng dụng để mở. Có thể cài lên màn hình chính điện thoại để dùng như app.</p>
    <div class="grid">
      <a class="card" href="port-academy/"><img src="port-academy/icons/icon-192.png" alt=""><div><b>Port Pro Academy</b><span>Học luật hải quan, hàng hải, logistics kho bãi, nâng hạ siêu trọng, tiếng Anh cảng, quản lý</span></div></a>
      <a class="card" href="expense-app/"><img src="expense-app/icons/icon-192.png" alt=""><div><b>Sổ Chi Tiêu</b><span>Quản lý thu chi cá nhân, chạy offline</span></div></a>
    </div>
  </main>
</body>
</html>
